l_english:
 collapsing_armies.1.title: "Collapsing Horde Armies"
 collapsing_armies.1.desc: "A crown of glass, a broken oath. The iron bond that once held the horde has snapped, undone by a ruler’s wavering hand and the rot of internal strife. Loyalty has withered into apathy; the thundering tide is now a silent retreat as warriors vanish like smoke into the desert winds, leaving behind only empty tents and a fading legacy."
 collapsing_armies.1.entry: "Our army is collapsing..."
 collapsing_armies.1.a: "This is the end..."
 collapsing_armies.1.b: "As it turns out, it was all just talk."